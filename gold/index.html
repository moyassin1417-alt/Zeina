<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0C0D0F">
<title>دفتر الذهب</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&family=Reem+Kufi:wght@600&display=swap">
<style>
/* Dark luxury ledger: near-black ground, warm ivory text, one gold gradient used for emphasis only */
:root{
  --bg:#0C0D0F; --surface:#15171A; --surface2:#1C1F23; --line:#2A2D32; --field:#101215;
  --ink:#F2EFE8; --mute:#9A978F; --gold:#D8AE4A; --gold-hi:#F3D58B; --gold-lo:#9C7424; --gold-soft:rgba(216,174,74,.12);
  --pos:#5AD19A; --neg:#F2817A;
  --brass:#D8AE4A; --brass-fill:#D8AE4A; --brass-soft:rgba(216,174,74,.14);
  --gold-grad:linear-gradient(135deg,#F3D58B 0%,#D8AE4A 48%,#9C7424 100%);
  --ui:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  --disp:'Reem Kufi','IBM Plex Sans Arabic',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{direction:rtl;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.55;
  padding:env(safe-area-inset-top,0) max(16px,env(safe-area-inset-right,0px)) 96px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:560px;margin-inline:auto}
header{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 78%,transparent);padding-block:14px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-family:var(--disp);font-size:26px;margin:0;font-weight:600;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.2}
h1 small{display:block;font-family:var(--ui);font-size:12px;color:var(--mute);font-weight:400;-webkit-text-fill-color:var(--mute)}
.home-link{font-size:13px;font-weight:600;color:var(--gold);text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;white-space:nowrap}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:2px}
.seg button{border:0;background:none;color:var(--mute);font:inherit;font-weight:500;padding:5px 14px;border-radius:99px;cursor:pointer;min-height:34px}
.seg button[aria-pressed="true"]{background:var(--gold-grad);color:#16130A;font-weight:600}
section[hidden]{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-block:12px}
.card h2{font-size:13px;margin:0 0 10px;color:var(--mute);font-weight:500;letter-spacing:.2px}
.num{font-family:var(--mono);direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;font-weight:500}
.amt{display:inline-flex;direction:ltr;unicode-bidi:isolate;gap:5px;align-items:baseline;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.amt b{font-weight:500}.amt i{font-style:normal;font-family:var(--ui);font-size:.72em;color:var(--mute)}
.pos{color:var(--pos)} .neg{color:var(--neg)}
/* price board */
.board{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 14px 16px;margin-block:6px 12px}
.board .top{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--mute)}
.live{display:inline-flex;align-items:center;gap:6px}.live i{width:7px;height:7px;border-radius:50%;background:var(--mute)}.live.on i{background:var(--pos);box-shadow:0 0 0 3px rgba(90,209,154,.18)}
.chips{display:flex;gap:6px;margin-block:12px 10px;overflow-x:auto;scrollbar-width:none}
.chip{flex:1;min-width:44px;border:1px solid var(--line);background:var(--surface2);color:var(--mute);border-radius:99px;font:inherit;font-family:var(--mono);font-weight:600;min-height:38px;cursor:pointer}
.chip.on{background:var(--gold-grad);border-color:transparent;color:#16130A}
.board .big{font-family:var(--mono);direction:ltr;unicode-bidi:isolate;font-size:40px;font-weight:600;line-height:1.1;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;text-align:center}
.board .big small{font-family:var(--ui);font-size:14px;-webkit-text-fill-color:var(--mute);margin-inline-start:6px}
.board .cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.board .cols div{background:var(--surface2);border-radius:12px;padding:8px 10px;text-align:center}
.board .cols.c3{grid-template-columns:repeat(3,1fr)}.board .cols em{display:block;font-style:normal;font-size:11px;color:var(--mute);margin-top:2px}.board .oz{display:flex;justify-content:space-between;margin-top:10px;padding:8px 10px;border-radius:12px;background:var(--surface2);font-size:13px;color:var(--mute)}.board .oz b{color:var(--gold-hi)}
.board .cols span{display:block;font-size:12px;color:var(--mute)}
/* hero */
.hero{position:relative;overflow:hidden;background:radial-gradient(120% 140% at 100% 0%,rgba(216,174,74,.20),transparent 55%),var(--surface);border:1px solid rgba(216,174,74,.35);border-radius:18px;padding:18px;margin-block:12px}
.hero .lbl{font-size:13px;color:var(--mute)}
.hero .big{font-family:var(--mono);direction:ltr;unicode-bidi:isolate;font-size:36px;font-weight:600;line-height:1.2;margin-block:4px}
.hero .sub{font-size:13px;color:var(--mute);display:flex;gap:6px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.stat .l{font-size:12.5px;color:var(--mute)} .stat .v{font-size:19px;margin-top:2px}
/* weight meter */
.meter{position:relative;height:10px;border-radius:99px;background:var(--surface2);margin-block:14px 8px}
.meter .mf{position:absolute;inset-block:0;inset-inline-start:0;border-radius:99px;background:var(--gold-grad)}
.meter .mt{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:2px}
.meter-l{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mute)}
.gainpill{display:inline-block;margin-top:8px;border-radius:99px;padding:3px 12px;font-family:var(--mono);font-weight:600;font-size:14px;background:rgba(90,209,154,.12);color:var(--pos)}
.gainpill.neg{background:rgba(242,129,122,.12);color:var(--neg)}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--mute);font-weight:500;text-align:start;padding:6px 4px;border-bottom:1px solid var(--line)}
td{padding:8px 4px;border-bottom:1px solid var(--line)} tr:last-child td{border-bottom:0}
td.r,th.r{text-align:end}
.kbadge{display:inline-block;min-width:38px;text-align:center;background:var(--gold-soft);color:var(--gold);border-radius:99px;font-family:var(--mono);font-weight:600;padding:1px 8px}
label{display:block;font-size:12.5px;color:var(--mute);margin-bottom:3px}
input,select{width:100%;min-height:44px;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:12px;padding:8px 12px;font:inherit;font-size:16px}
input[inputmode]{font-family:var(--mono);direction:ltr;text-align:right}
input:disabled{opacity:.6}
input:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.row{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
.row3{display:grid;gap:10px;grid-template-columns:repeat(3,minmax(0,1fr))}
.f{margin-block:8px;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:8px 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.btn.main{background:var(--gold-grad);border-color:transparent;color:#16130A}
.btn.sm{min-height:36px;padding:4px 14px;font-size:13.5px}
.btn.bad{color:var(--neg)} .btn.wide{width:100%}
.res{background:var(--field);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px}
.res div{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.res .tot{border-top:1px dashed var(--line);margin-top:4px;padding-top:7px;font-weight:600;font-size:16px}
.pc{border:1px solid var(--line);border-radius:14px;padding:10px;margin-block:8px;background:var(--field)}
.pc .top{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.pc .row3{margin-top:8px}
.pc .x{border:0;background:none;color:var(--neg);font-size:22px;cursor:pointer;min-width:40px;min-height:40px}
.pc .pv{font-size:13px;color:var(--mute);margin-top:6px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.side-h{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.tag{font-size:11.5px;padding:1px 10px;border-radius:99px;background:var(--gold-soft);color:var(--gold);font-weight:600}
details summary{cursor:pointer;font-weight:600;min-height:36px;display:flex;align-items:center;justify-content:space-between}
.note{font-size:12.5px;color:var(--mute)}
.empty{text-align:center;color:var(--mute);padding:26px 8px}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:62px 1fr 92px;gap:8px;align-items:center;font-size:13px}
.bar .t{height:8px;background:var(--surface2);border-radius:5px;position:relative;overflow:hidden}
.bar .t i{position:absolute;top:0;bottom:0;inset-inline-start:0;border-radius:5px}
/* timeline log */
.mh{display:flex;justify-content:space-between;align-items:baseline;margin:20px 2px 8px}
.mh b{font-family:var(--disp);font-size:18px;font-weight:600;color:var(--ink)}
.mh span{font-size:12.5px;color:var(--mute)}
.dr{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-block:8px;overflow:hidden;cursor:pointer}
.dr .hd{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px}
.badge{width:46px;text-align:center;border-radius:10px;padding:5px 0;font-size:12.5px;font-weight:600;background:var(--gold-soft);color:var(--gold)}
.badge.sell{background:rgba(90,209,154,.12);color:var(--pos)} .badge.swap{background:rgba(120,160,255,.14);color:#9DB7FF}
.dr .tt{min-width:0}.dr .tt b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dr .tt span{font-size:12.5px;color:var(--mute)}
.dr .rt{text-align:end;font-size:16px}.dr .rt small{display:block;font-family:var(--ui);font-size:11.5px;color:var(--mute)}
.dr .more{display:none;padding:0 12px 12px;border-top:1px solid var(--line);font-size:13.5px;color:var(--mute)}
.dr.open .more{display:block}.dr .more p{margin:8px 0 0}
.dr .acts{display:flex;gap:8px;margin-top:12px}
/* stock */
.pcard{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;margin-block:10px}
.medal{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:18px;color:#16130A;background:var(--gold-grad);box-shadow:inset 0 0 0 3px rgba(0,0,0,.18)}
.medal.ph{width:68px;height:68px;border-radius:16px;background-size:cover;background-position:center;position:relative;cursor:zoom-in;box-shadow:0 0 0 2px var(--gold)}.medal.ph em{position:absolute;inset-inline-end:-4px;bottom:-4px;font-style:normal;font-size:11px;background:var(--gold-grad);color:#16130A;border-radius:99px;padding:1px 6px;font-weight:700}
.viewer{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.92);display:grid;place-items:center;padding:20px}.viewer img{max-width:100%;max-height:80vh;border-radius:14px;box-shadow:0 0 0 2px var(--gold)}.viewer .btn{margin-top:14px}
.pcard .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.pcard .h b{font-weight:600}
.pcard .ln{font-size:13px;color:var(--mute);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:2px}
.pcard .acts{grid-column:1 / -1;display:flex;gap:8px;flex-wrap:wrap}
#fab{position:fixed;inset-inline-end:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;border:0;background:var(--gold-grad);color:#16130A;font-size:32px;line-height:1;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.5),0 0 0 1px rgba(243,213,139,.4);cursor:pointer;z-index:24;display:flex;align-items:center;justify-content:center;padding-bottom:3px}
#fab[hidden]{display:none}
.modes{display:grid;gap:10px}.mode{border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:14px;padding:14px;font:inherit;text-align:start;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.mode b{font-size:18px;color:var(--gold-hi)}.mode span{font-size:13px;color:var(--mute)}
.seg2{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);padding:4px;border-radius:14px;margin-bottom:12px}
.seg2 button{border:0;background:none;color:var(--mute);font:inherit;font-weight:600;min-height:40px;border-radius:10px;cursor:pointer}
.seg2 button[aria-pressed="true"]{background:var(--gold-grad);color:#16130A}
.toast .u{margin-inline-start:12px;background:rgba(0,0,0,.18);border:0;border-radius:99px;padding:3px 12px;font:inherit;font-weight:700;color:inherit;cursor:pointer}
nav{position:fixed;bottom:0;left:0;right:0;z-index:25;background:rgba(21,23,26,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav .in{max-width:560px;margin-inline:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
nav button{border:0;background:none;color:var(--mute);font:inherit;font-size:12px;font-weight:500;min-height:50px;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="page"]{color:var(--gold);background:var(--gold-soft)}
.toast{position:fixed;bottom:calc(88px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--gold-grad);color:#16130A;font-weight:600;padding:9px 18px;border-radius:99px;font-size:14px;z-index:40;max-width:90vw}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>دفتر الذهب<small id="sub"></small></h1>
    <a href="../" class="home-link" aria-label="بيت زينة (المصاريف)">🏠 بيت زينة</a>
    <div class="seg" role="group" aria-label="العملة">
      <button data-cur="SAR" aria-pressed="true">ريال</button>
      <button data-cur="EGP" aria-pressed="false">جنيه</button>
    </div>
  </header>
  <section id="v-home"></section>
  <section id="v-add" hidden></section>
  <section id="v-stock" hidden></section>
  <section id="v-calc" hidden></section>
  <section id="v-log" hidden></section>
</div>
<input type="file" id="photoIn" accept="image/*" hidden>
<button id="fab" class="fab" data-act="fab" aria-label="عملية جديدة">+</button>
<nav aria-label="التبويبات"><div class="in">
  <button data-tab="home" aria-current="page"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>الرئيسية</button>
  <button data-tab="add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>عملية</button>
  <button data-tab="stock"><svg viewBox="0 0 24 24"><path d="M4 8l8-4 8 4-8 4zM4 8v8l8 4 8-4V8M12 12v8"/></svg>المخزون</button>
  <button data-tab="calc"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h2M14 12h2M8 16h2M14 16h2"/></svg>حاسبة</button>
  <button data-tab="log"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5zM9 9h6M9 13h6M9 17h3"/></svg>السجل</button>
</div></nav>

<script>
(function(){
'use strict';
var KARATS=[24,22,21,18,14,9], CURN={SAR:'ريال',EGP:'جنيه'};
var cfg={cur:'SAR',ounce:0,usdsar:3.75,usdegp:0,local:{SAR:0,EGP:0},making:{SAR:0,EGP:0},spread:{SAR:0,EGP:0}};
var deals=[], pieces=[], tab='home', F=null, SP=null, live={ounce:0,egp:0,at:0,ok:false};
var dirty=false, syncT=null, lastTs=0;

/* ---------- helpers ---------- */
var AR='٠١٢٣٤٥٦٧٨٩';
function n(v){var s=String(v==null?'':v).replace(/[٠-٩]/g,function(d){return AR.indexOf(d)}).replace(/٫/g,'.').replace(/[,،\s]/g,'');var x=parseFloat(s);return isFinite(x)?x:0}
function fmt(v,d){d=d==null?2:d;return Number(v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d})}
function sg(v){return (v>0.005?'+':v<-0.005?'−':'')+fmt(Math.abs(v))}
function cl(v){return v>0.005?'pos':v<-0.005?'neg':''}
function r2(v){return Math.round(v*100)/100}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function $(s,r){return (r||document).querySelector(s)}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function toastUndo(t,undo){var e=document.createElement('div');e.className='toast';e.textContent=t;var b=document.createElement('button');b.className='u';b.textContent='تراجع';b.onclick=function(){undo();e.remove()};e.appendChild(b);document.body.appendChild(e);setTimeout(function(){e.remove()},6000)}
function toast(t){var e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(function(){e.remove()},2400)}
function kOpts(sel){return KARATS.map(function(k){return '<option value="'+k+'"'+(+sel===k?' selected':'')+'>'+k+'</option>'}).join('')}
function byId(a,id){for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* ---------- prices ---------- */
function ounce(){return live.ounce>0?live.ounce:cfg.ounce}
function rateOf(c){return c==='SAR'?cfg.usdsar:(live.egp>0?live.egp:cfg.usdegp)}
function g24(c){var r=rateOf(c),o=ounce();return (o>0&&r>0)?o/31.1034768*r:0}
function p21(c){var l=cfg.local[c];return l>0?l:g24(c)*21/24}         /* سعر البيع للجمهور */
function p21buy(c){var p=p21(c);return p>0?Math.max(0,p-n(cfg.spread[c])):0} /* سعر شراء الكسر */
function pk(k,c){return p21(c)*k/21}

/* ---------- math ---------- */
function legVal(p,P){var w=n(p.w);return w*P*(+p.k)/21+w*n(p.m)}
function inVal(p,P){return n(p.total)>0?n(p.total):legVal(p,P)}
function leg21(p){return n(p.w)*(+p.k)/21}
function legBasis(p,pBuy){ /* تكلفة القطعة الخارجة */
  if(p.pid){var pc=byId(pieces,p.pid);if(pc)return n(pc.cost);return n(p.basis)}
  if(n(p.cost)>0)return n(p.cost);
  return n(p.w)*pBuy*(+p.k)/21;
}
function calc(d){
  var sell=0,buy=0,o21=0,i21=0,basis=0;
  d.out.forEach(function(p){sell+=legVal(p,n(d.pSell));o21+=leg21(p);basis+=legBasis(p,n(d.pBuy))});
  if(n(d.sellTotal)>0)sell=n(d.sellTotal);
  d.in.forEach(function(p){buy+=inVal(p,n(d.pBuy));i21+=leg21(p)});
  var exp=sell-buy, manual=!(d.cash===''||d.cash==null), cash=manual?n(d.cash):exp;
  return {sell:sell,buy:buy,exp:exp,cash:cash,gold:i21-o21,o21:o21,i21:i21,basis:basis,profit:d.out.length?sell-basis:0};
}
function stockList(c){return pieces.filter(function(p){return p.cur===c&&p.status==='stock'}).sort(function(a,b){return a.date<b.date?1:-1})}
function pieceMarket(p,c){return n(p.w)*p21buy(c)*(+p.k)/21}

/* ---------- persistence + sync ---------- */
function snapshot(){return {v:2,ts:Date.now(),cfg:cfg,deals:deals,pieces:pieces}}
function applySnapshot(s){
  if(!s)return;
  if(s.cfg){for(var k in s.cfg){if(k==='local'||k==='making'||k==='spread')cfg[k]=Object.assign({SAR:0,EGP:0},s.cfg[k]);else cfg[k]=s.cfg[k]}}
  deals=s.deals||[];pieces=s.pieces||[];lastTs=s.ts||0;
}
function saveAll(){
  var s=snapshot();lastTs=s.ts;lsSet('gold_data_v2',JSON.stringify(s));
  dirty=true;lsSet('gold_dirty','1');
  clearTimeout(syncT);syncT=setTimeout(syncPush,700);
}
function loadLocal(){try{applySnapshot(JSON.parse(lsGet('gold_data_v2')||'null'))}catch(e){}dirty=lsGet('gold_dirty')==='1'}
function skey(){return lsGet('gold_key')||lsGet('zainah_key')||''}
function sbin(){return lsGet('gold_bin')||''}
var syncState='off';
function setSync(st){syncState=st;var e=$('#syncSt');if(e)e.textContent=({off:'غير مفعّلة',ok:'متزامن',busy:'جاري المزامنة...',err:'تعذرت المزامنة (الحفظ على الجهاز)'})[st]||''}
async function api(method,path,body){
  var h={'Content-Type':'application/json','X-Master-Key':skey()};
  if(method==='POST'){h['X-Bin-Private']='true';h['X-Bin-Name']='gold-ledger'}
  var r=await fetch('https://api.jsonbin.io/v3/'+path,{method:method,headers:h,body:body?JSON.stringify(body):undefined});
  if(!r.ok)throw new Error('http '+r.status);return r.json();
}
async function syncPush(){
  if(!sbin()||!skey()){return}
  try{setSync('busy');await api('PUT','b/'+sbin(),snapshot());dirty=false;lsSet('gold_dirty','0');setSync('ok')}catch(e){setSync('err')}
}
async function syncPull(){
  if(!sbin()||!skey()||dirty)return;
  try{
    var j=await api('GET','b/'+sbin()+'/latest');var s=j.record;
    if(s&&s.ts&&s.ts>lastTs){applySnapshot(s);lsSet('gold_data_v2',JSON.stringify(snapshot()));if(!F||!F.id)newForm();renderAll()}
    setSync('ok');
  }catch(e){setSync('err')}
}
async function createBin(){
  if(!skey()){toast('اكتب مفتاح jsonbin أولًا');return}
  try{var j=await api('POST','b',snapshot());lsSet('gold_bin',j.metadata.id);dirty=false;lsSet('gold_dirty','0');toast('تم تفعيل المزامنة');renderHome()}catch(e){toast('فشل إنشاء المخزن، راجع المفتاح')}
}

  var out=F.out.filter(function(p){return n(p.w)>0}),inn=F.in.filter(function(p){return n(p.w)>0});

  if(F.id){var b=blocked(F.id);if(b){toast('القطعة "'+(b.name||'')+'" اتباعت في عملية لاحقة، عدّل تلك أولًا');return}revertDeal(F.id)}
  var id=F.id||('d'+Date.now());
  var d={id:id,date:F.date||today(),note:F.note.trim(),cur:F.cur,pSell:n(F.pSell),pBuy:n(F.pBuy),cash:null,ts:Date.now(),out:[],in:[]};
  if(n(F.sellTotal)>0)d.sellTotal=n(F.sellTotal);
  out.forEach(function(p){
    var leg={pid:p.pid||'',name:p.name.trim(),k:+p.k,w:n(p.w),m:n(p.m)};
    if(p.pid){var pc=byId(pieces,p.pid);if(pc){leg.name=pc.name;leg.k=pc.k;leg.w=n(pc.w);leg.basis=n(pc.cost);pc.status='sold';pc.soldDeal=id}}
    else if(n(p.cost)>0)leg.cost=n(p.cost);
    d.out.push(leg);
  });
  inn.forEach(function(p,i){
    var leg={name:p.name.trim(),k:+p.k,w:n(p.w),m:n(p.m)};if(n(p.total)>0)leg.total=n(p.total);d.in.push(leg);

  });
  d.cash=r2(calc({pSell:d.pSell,pBuy:d.pBuy,sellTotal:d.sellTotal,out:d.out,in:d.in,cash:F.cash}).cash);
  deals=deals.filter(function(x){return x.id!==id});deals.push(d);
  saveAll();toast('تم الحفظ');newForm();renderAll();showTab('log');
}

var MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];

function amt(v,unit,signed,c){var t=signed?sg(v):fmt(v);var k=c===undefined?(signed?cl(v):''):c;return '<span class="amt '+k+'"><b>'+t+'</b>'+(unit?'<i>'+unit+'</i>':'')+'</span>'}
function priceChart(c,L){
  var pts={},H={};try{H=(JSON.parse(lsGet('gold_hist')||'{}')[c])||{}}catch(e){}
  var dealD={};
  L.forEach(function(d){if(n(d.pSell)>0)dealD[d.date]=n(d.pSell)});
  Object.keys(dealD).forEach(function(k){pts[k]=dealD[k]});
  Object.keys(H).forEach(function(k){pts[k]=H[k]});
  var P=p21(c);if(P>0)pts[today()]=P;
  var ks=Object.keys(pts).sort();
  if(ks.length<2)return '<div class="empty">الرسم هيظهر بعد ما يتجمع سعران على الأقل.</div>';
  var W=320,Hh=150,pl=8,pr=8,pt=14,pb=22,vs=ks.map(function(k){return pts[k]});
  var mn=Math.min.apply(null,vs),mx=Math.max.apply(null,vs),pad=(mx-mn)*.12||mx*.02;mn-=pad;mx+=pad;

function profitChart(L){

   '<circle cx="'+X(li).toFixed(1)+'" cy="'+Y(vs[li]).toFixed(1)+'" r="4.5" fill="var(--pos)" stroke="var(--bg)" stroke-width="2"/>'+
   '<text x="'+(W-pr)+'" y="'+Math.max(10,Y(vs[li])-9).toFixed(1)+'" font-size="11" font-weight="700" fill="var(--pos)" text-anchor="end">'+fmt(vs[li])+'</text>'+labs+'</svg>'+

function download(name,text,type){var b=new Blob(['﻿'+text],{type:type});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500)}
function exportCsv(){

    rows.push([d.date,d.cur,d.note||'',d.out.map(function(p){return (p.name||'قطعة')+' '+p.k+'ك '+p.w+'جم'}).join(' + '),d.in.map(function(p){return (p.name||'قطعة')+' '+p.k+'ك '+p.w+'جم'}).join(' + '),d.pSell,d.pBuy,r2(k.cash),r2(k.gold),r2(k.profit)])});
  download('gold-deals.csv',rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"'}).join(',')}).join('\r\n'),'text/csv;charset=utf-8');
}

document.addEventListener('click',function(e){
  var ch=e.target.closest('.chip');if(ch){selK=+ch.dataset.k;var so=$('#setBox')&&$('#setBox').open;renderHome();if(so)$('#setBox').open=true;return}
  var vw=e.target.closest('[data-view]');if(vw){var u=photos()[vw.dataset.view];if(u){var o=document.createElement('div');o.className='viewer';o.innerHTML='<div style="text-align:center"><img src="'+u+'" alt="صورة القطعة"><br><button class="btn sm bad" id="phDel">حذف الصورة</button> <button class="btn sm" id="phX">إغلاق</button></div>';document.body.appendChild(o);o.onclick=function(ev){if(ev.target===o||ev.target.id==='phX')o.remove();else if(ev.target.id==='phDel'){setPhoto(vw.dataset.view,null);o.remove();renderStock()}}}return}
  var rw=e.target.closest('.dr');if(rw&&!e.target.closest('button')){rw.classList.toggle('open');return}
  var b=e.target.closest('button');if(!b)return;
  if(b.dataset.tab){showTab(b.dataset.tab);return}
  if(b.dataset.cur){if(cfg.cur===b.dataset.cur)return;cfg.cur=b.dataset.cur;saveAll();F=null;newSP();renderAll();return}
  var act=b.dataset.act;if(!act)return;
  if(act==='photo'){var pc0=b.closest('.pcard');photoPid=pc0&&pc0.dataset.pid;$('#photoIn').click();return}
  if(act==='mode'){setMode(b.dataset.m);renderAdd();return}
  if(act==='fab'){if(!F||F.id)newForm();renderAdd();showTab('add');return}
  if(act==='add'){F[b.dataset.side].push(newLeg(b.dataset.side));renderAdd();return}
  if(act==='rm'){var r=b.closest('.pc');F[r.dataset.side].splice(+r.dataset.i,1);renderAdd();return}
  if(act==='reset'){newForm();renderAdd();return}
  if(act==='save'){submitDeal();return}
  if(act==='csv'){exportCsv();return}
  if(act==='backup'){var bk=snapshot();bk.photos=photos();download('gold-backup.json',JSON.stringify(bk),'application/json');return}
  if(act==='restore'){$('#fileIn').click();return}
  if(act==='syncnow'){syncPush().then(syncPull);return}
  if(act==='mkbin'){var k=$('#sKey').value.trim();if(k)lsSet('gold_key',k);createBin();return}
  if(act==='joinbin'){var id=$('#sJoin').value.trim(),k2=$('#sKey')?$('#sKey').value.trim():'';if(k2)lsSet('gold_key',k2);if(!id||!skey()){toast('اكتب المفتاح ورقم المخزن');return}lsSet('gold_bin',id);dirty=false;lastTs=0;syncPull().then(renderHome);return}
  if(act==='savepc'){SP.name=$('#sName').value;SP.k=+$('#sK').value;SP.w=$('#sW').value;SP.cost=$('#sC').value;savePiece();return}
  var it=b.closest('.item')||b.closest('.pcard')||b.closest('.dr');
  if(act==='sellpc'&&it){newForm();F.out=[{pid:it.dataset.pid,name:'',k:21,w:'',m:cfg.making[cfg.cur]?String(cfg.making[cfg.cur]):'',cost:''}];F.in=[];F.mode='sell';fillLinked(F.out[0]);renderAdd();showTab('add');return}
  if(act==='editpc'&&it){var p=byId(pieces,it.dataset.pid);SP={id:p.id,name:p.name,k:p.k,w:String(p.w),cost:String(p.cost),date:p.date};renderStock();$('#spBox').open=true;$('#spBox').scrollIntoView();return}
  if(act==='delpc'&&it){var snP=JSON.stringify(pieces);pieces=pieces.filter(function(x){return x.id!==it.dataset.pid});saveAll();renderStock();renderHome();toastUndo('تم حذف القطعة',function(){pieces=JSON.parse(snP);saveAll();renderStock();renderHome()});return}
  if(act==='edit'&&it){var d=byId(deals,it.dataset.id);if(d){formFromDeal(d);renderAdd();showTab('add')}return}
  if(act==='del'&&it){
    var bl=blocked(it.dataset.id);if(bl){toast('القطعة "'+bl.name+'" اتباعت في عملية لاحقة');return}
    var snD=JSON.stringify({d:deals,p:pieces});
    revertDeal(it.dataset.id);deals=deals.filter(function(x){return x.id!==it.dataset.id});saveAll();renderAll();
    toastUndo('تم الحذف',function(){var o=JSON.parse(snD);deals=o.d;pieces=o.p;saveAll();renderAll()});return}
});
function confirmTap(b,fn){
  if(b.dataset.arm){fn();return}
  b.dataset.arm='1';var t=b.textContent;b.textContent='اضغط للتأكيد';setTimeout(function(){if(b.isConnected){delete b.dataset.arm;b.textContent=t}},3000);
}
function fillLinked(leg){var pc=byId(pieces,leg.pid);if(pc){leg.name=pc.name;leg.k=pc.k;leg.w=String(pc.w)}}
document.addEventListener('input',function(e){
  var t=e.target,pc=t.closest&&t.closest('.pc');
  if(pc&&t.dataset.f&&t.dataset.f!=='pid'&&t.dataset.f!=='k'){F[pc.dataset.side][+pc.dataset.i][t.dataset.f]=t.value;updateSum();return}
  if(t.id==='fDate')F.date=t.value;else if(t.id==='fNote')F.note=t.value;
  else if(t.id==='fSellTotal'){F.sellTotal=t.value;updateSum()}
  else if(t.id==='fSell'){F.pSell=t.value;updateSum()}else if(t.id==='fBuy'){F.pBuy=t.value;updateSum()}else if(t.id==='fCash'){F.cash=t.value;updateSum()}
  else if(/^c\d|^cP$/.test(t.id))runCalc();
});
document.addEventListener('change',function(e){
  var t=e.target,c=cfg.cur,pc=t.closest&&t.closest('.pc');
  if(pc&&t.dataset.f==='k'){F[pc.dataset.side][+pc.dataset.i].k=+t.value;updateSum();return}
  if(pc&&t.dataset.f==='pid'){var leg=F.out[+pc.dataset.i];leg.pid=t.value;if(leg.pid)fillLinked(leg);else{leg.name='';leg.w=''}renderAdd();return}
  if(/^c\d|^cP$/.test(t.id)){runCalc();return}
  if(t.id==='photoIn'){var f0=t.files[0];t.value='';if(!f0||!photoPid)return;var pid0=photoPid;compressImg(f0,function(u){setPhoto(pid0,u);renderStock();toast('تم حفظ الصورة')});return}
  if(t.id==='fileIn'){var f=t.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){try{var s=JSON.parse(rd.result);if(!s.deals&&!s.pieces)throw 0;applySnapshot(s);if(s.photos){try{lsSet('gold_photos',JSON.stringify(s.photos))}catch(x){}}s.ts=Date.now();lastTs=s.ts;saveAll();newForm();renderAll();toast('تم الاسترجاع')}catch(x){toast('ملف غير صالح')}};rd.readAsText(f);return}
  var map={sOz:function(){cfg.ounce=n(t.value)},sSar:function(){cfg.usdsar=n(t.value)},sEgp:function(){cfg.usdegp=n(t.value)},sLoc:function(){cfg.local[c]=n(t.value)},sSp:function(){cfg.spread[c]=n(t.value)},sMk:function(){cfg.making[c]=n(t.value)}};
  if(map[t.id]){map[t.id]();saveAll();var open=$('#setBox').open;renderHome();$('#setBox').open=open;renderCalc();renderStock();toast('تم الحفظ')}
});

/* ---------- boot ---------- */
loadLocal();
try{var lv=JSON.parse(lsGet('gold_live')||'null');if(lv)live=lv;live.ok=false}catch(e){}
newForm();newSP();renderAll();showTab('home');
fetchLive();setInterval(fetchLive,300000);
syncPull();setInterval(syncPull,20000);
document.addEventListener('visibilitychange',function(){if(!document.hidden){syncPull();fetchLive()}});
if(dirty&&sbin())syncPush();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
</body>
